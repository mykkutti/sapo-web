<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>사포 - 경기 라인업</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: #f8fafc; color: #111827; min-height: 100vh; }
    .container { max-width: 420px; margin: 0 auto; padding: 16px; }
    .loading { text-align: center; padding: 80px 0; color: #9ca3af; font-size: 16px; }
    .error { text-align: center; padding: 80px 20px; }
    .error h2 { font-size: 18px; color: #374151; margin-bottom: 8px; }
    .error p { color: #9ca3af; font-size: 14px; }

    .header { text-align: center; padding: 20px 0 16px; }
    .header h1 { font-size: 22px; font-weight: 700; }
    .header .sub { font-size: 14px; color: #6b7280; margin-top: 4px; }

    .match-info { background: #f0fdf4; border: 1px solid #bbf7d0; border-radius: 10px; padding: 12px 16px; margin-bottom: 12px; font-size: 14px; color: #166534; }

    .attendance { display: flex; gap: 12px; justify-content: center; background: #f0fdf4; border: 1px solid #bbf7d0; border-radius: 10px; padding: 10px 16px; margin-bottom: 16px; font-size: 13px; font-weight: 700; }
    .att-attending { color: #059669; }
    .att-hold { color: #6b7280; }
    .att-absent { color: #dc2626; }
    .att-pending { color: #d97706; }

    /* 필드 캔버스 */
    .field-wrap { margin-bottom: 16px; border-radius: 10px; overflow: hidden; }
    .field-wrap canvas { display: block; width: 100%; }

    .section { margin-bottom: 16px; }
    .section-title { font-size: 14px; font-weight: 600; color: #374151; margin-bottom: 8px; border-bottom: 1px solid #e5e7eb; padding-bottom: 6px; }
    .section-title.dim { color: #9ca3af; }
    .player-list { display: flex; flex-wrap: wrap; gap: 6px; }
    .player { background: #fff; border: 1px solid #e5e7eb; border-radius: 8px; padding: 6px 12px; font-size: 13px; font-weight: 500; }
    .player.starting { background: #eff6ff; border-color: #bfdbfe; color: #1d4ed8; }
    .player.sub { background: #f0fdf4; border-color: #bbf7d0; color: #166534; }
    .player.dim { opacity: 0.5; }

    .cta { text-align: center; padding: 24px 0 16px; }
    .open-app { display: inline-block; background: #2563eb; color: #fff; font-size: 16px; font-weight: 700; padding: 14px 32px; border-radius: 12px; text-decoration: none; }
    .open-app:active { background: #1d4ed8; }
    .store-links { margin-top: 16px; display: flex; justify-content: center; gap: 16px; font-size: 13px; }
    .store-links a { color: #6b7280; text-decoration: underline; }

    .footer { text-align: center; padding: 24px 0; font-size: 12px; color: #9ca3af; }
  </style>
</head>
<body>
  <div class="container" id="app">
    <div class="loading">로딩 중...</div>
  </div>

  <script type="module">
    import { init } from 'https://esm.sh/@instantdb/core@0.22.169';

    // GitHub Pages SPA: sessionStorage에서 원래 경로 복원
    const stored = sessionStorage.getItem('spa-path');
    if (stored) {
      sessionStorage.removeItem('spa-path');
      history.replaceState(null, '', stored);
    }

    const path = window.location.pathname;
    const match = path.match(/\/lineup\/([^/]+)/);
    const code = match ? match[1] : null;
    const app = document.getElementById('app');

    if (!code) {
      app.innerHTML = '<div class="error"><h2>참가코드가 필요합니다</h2><p>공유받은 링크로 접속해주세요</p></div>';
    } else {
      const db = init({ appId: '270b0c68-1f89-4454-925e-cfa11f77c380' });

      db.subscribeQuery(
        { lineups: { $: { where: { code } }, players: { attendances: {} }, attendances: {} } },
        (result) => {
          if (result.error) {
            app.innerHTML = `<div class="error"><h2>오류가 발생했습니다</h2></div>`;
            return;
          }
          const lineup = result.data?.lineups?.[0];
          if (!lineup) {
            app.innerHTML = `<div class="error"><h2>경기를 찾을 수 없어요</h2><p>코드: ${code}</p></div>`;
            return;
          }
          renderPage(lineup);
        }
      );
    }

    // ── 필드 테마 (앱과 동일) ──
    const FIELD = {
      aspectRatio: 0.924,
      padding: 8,
      bgColor: '#166534',
      lineColor: 'rgba(255,255,255,0.35)',
      lineWidth: 1.5,
      penaltyBoxWidth: 0.44,
      penaltyBoxHeight: 0.16,
      goalAreaWidth: 0.22,
      goalAreaHeight: 0.06,
      centerCircleRadius: 0.14,
      centerDotRadius: 3,
    };
    const TOKEN = {
      radius: 22,
      bgColor: '#2563eb',
      tempBgColor: '#6366f1',
      textColor: 'white',
      numberFontSize: 14,
      nameFontSize: 9,
    };

    function drawField(canvas, fieldPlayers) {
      const dpr = window.devicePixelRatio || 1;
      const cssW = canvas.parentElement.clientWidth;
      const cssH = cssW * FIELD.aspectRatio;
      canvas.style.height = cssH + 'px';
      canvas.width = cssW * dpr;
      canvas.height = cssH * dpr;

      const ctx = canvas.getContext('2d');
      ctx.scale(dpr, dpr);

      const pad = FIELD.padding;
      const fw = cssW - pad * 2;
      const fh = cssH - pad * 2;
      const fx = pad;
      const fy = pad;

      // 배경
      ctx.fillStyle = FIELD.bgColor;
      ctx.fillRect(0, 0, cssW, cssH);

      // 필드 라인
      ctx.strokeStyle = FIELD.lineColor;
      ctx.lineWidth = FIELD.lineWidth;

      // 외곽선
      ctx.strokeRect(fx, fy, fw, fh);

      // 하프라인
      ctx.beginPath();
      ctx.moveTo(fx, fy + fh / 2);
      ctx.lineTo(fx + fw, fy + fh / 2);
      ctx.stroke();

      // 센터 서클
      const cx = fx + fw / 2;
      const cy = fy + fh / 2;
      ctx.beginPath();
      ctx.arc(cx, cy, fw * FIELD.centerCircleRadius, 0, Math.PI * 2);
      ctx.stroke();

      // 센터 도트
      ctx.fillStyle = FIELD.lineColor;
      ctx.beginPath();
      ctx.arc(cx, cy, FIELD.centerDotRadius, 0, Math.PI * 2);
      ctx.fill();

      // 페널티 박스 (상단)
      const pbw = fw * FIELD.penaltyBoxWidth;
      const pbh = fh * FIELD.penaltyBoxHeight;
      ctx.strokeRect(cx - pbw / 2, fy, pbw, pbh);

      // 골 에어리어 (상단)
      const gaw = fw * FIELD.goalAreaWidth;
      const gah = fh * FIELD.goalAreaHeight;
      ctx.strokeRect(cx - gaw / 2, fy, gaw, gah);

      // 페널티 박스 (하단)
      ctx.strokeRect(cx - pbw / 2, fy + fh - pbh, pbw, pbh);

      // 골 에어리어 (하단)
      ctx.strokeRect(cx - gaw / 2, fy + fh - gah, gaw, gah);

      // 선수 토큰
      for (const p of fieldPlayers) {
        if (p.positionX == null || p.positionY == null) continue;
        const px = fx + p.positionX * fw;
        const py = fy + p.positionY * fh;
        const r = TOKEN.radius;

        // 원
        ctx.fillStyle = p.isTemp ? TOKEN.tempBgColor : TOKEN.bgColor;
        ctx.beginPath();
        ctx.arc(px, py, r, 0, Math.PI * 2);
        ctx.fill();

        // 등번호
        ctx.fillStyle = TOKEN.textColor;
        ctx.font = `bold ${TOKEN.numberFontSize}px -apple-system, sans-serif`;
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        const numText = p.number != null ? String(p.number) : '--';
        ctx.fillText(numText, px, py - 2);

        // 이름
        ctx.font = `${TOKEN.nameFontSize}px -apple-system, sans-serif`;
        ctx.fillStyle = 'rgba(255,255,255,0.85)';
        const name = p.name.length > 6 ? p.name.slice(0, 5) + '…' : p.name;
        ctx.fillText(name, px, py + r + 10);
      }
    }

    function renderPage(lineup) {
      const players = lineup.players || [];
      const holdIds = new Set(
        players.filter(p => (p.attendances || [])[0]?.response === 'hold').map(p => p.id)
      );

      const starting = players.filter(p => p.status === 'starting');
      const sub = players.filter(p => p.status === 'sub');
      const hold = players.filter(p => p.status === 'none' && holdIds.has(p.id));
      const none = players.filter(p => p.status === 'none' && !holdIds.has(p.id));
      const absent = players.filter(p => p.status === 'unavailable');

      const atts = lineup.attendances || [];
      const attCount = {
        attending: atts.filter(a => a.response === 'attending').length,
        hold: atts.filter(a => a.response === 'hold').length,
        absent: atts.filter(a => a.response === 'absent').length,
        pending: atts.filter(a => a.response === 'pending').length,
      };
      const hasAttendance = atts.length > 0;

      const tag = (p, cls) => {
        const num = p.number != null ? `${p.number}. ` : '';
        return `<span class="player ${cls}">${num}${p.name}</span>`;
      };
      const sec = (title, list, cls, dim) => {
        if (!list.length) return '';
        return `<div class="section"><div class="section-title ${dim ? 'dim' : ''}">${title} ${list.length}</div><div class="player-list">${list.map(p => tag(p, cls)).join('')}</div></div>`;
      };

      let matchHtml = '';
      if (lineup.matchLocation || lineup.matchDate) {
        const parts = [];
        if (lineup.matchLocation) parts.push(lineup.matchLocation);
        if (lineup.matchDate) parts.push(new Date(lineup.matchDate).toLocaleDateString('ko-KR'));
        matchHtml = `<div class="match-info">${parts.join(' · ')}</div>`;
      }

      let attHtml = '';
      if (hasAttendance) {
        attHtml = `<div class="attendance"><span class="att-attending">참석 ${attCount.attending}</span><span class="att-hold">보류 ${attCount.hold}</span><span class="att-absent">불참 ${attCount.absent}</span><span class="att-pending">미응답 ${attCount.pending}</span></div>`;
      }

      const deepLink = `sapo://lineup/${code}`;

      app.innerHTML = `
        <div class="header">
          <h1>${lineup.name || code}</h1>
          <div class="sub">${code} · ${lineup.formation}</div>
        </div>
        ${matchHtml}
        ${attHtml}
        <div class="field-wrap"><canvas id="field"></canvas></div>
        ${sec('교체명단', sub, 'sub', false)}
        ${sec('보류', hold, 'dim', true)}
        ${sec('미확인', none, 'dim', true)}
        ${sec('불참', absent, 'dim', true)}
        <div class="cta">
          <a class="open-app" href="${deepLink}">앱에서 열기</a>
          <div class="store-links">
            <a href="#">App Store</a>
            <a href="#">Google Play</a>
          </div>
        </div>
        <div class="footer">사포 — 축구 라인업 관리</div>
      `;

      // 필드 렌더링
      const canvas = document.getElementById('field');
      if (canvas) drawField(canvas, starting);
    }
  </script>
</body>
</html>
